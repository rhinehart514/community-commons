[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bp-commons"
version = "0.2.0"
description = "Buffalo Projects Community Commons: sourced identities, capabilities, and affiliation histories."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rapidfuzz>=3.14,<4", "Flask>=3.1,<4"]

[project.scripts]
bp-commons = "bp_commons.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bp_commons = ["static/*"]

[project.urls]
Repository = "https://github.com/rhinehart514/community-commons"
