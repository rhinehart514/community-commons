[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bp-commons"
version = "0.1.0"
description = "Evidence infrastructure for connecting capabilities with needs."
requires-python = ">=3.11"
dependencies = ["rapidfuzz>=3.14,<4", "Flask>=3.1,<4"]

[project.scripts]
bp-commons = "bp_commons.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bp_commons = ["static/*"]
